interface:
  display_name: "Open Accounting System Builder"
  short_description: "Build books and visual owner reports from one POSTED journal"
  brand_color: "#0F766E"
  default_prompt: "Use $company-accounting-system-builder to first show me a recommended multi-select feature menu without treating recommendations as confirmation. If I select O6, also ask which native charts I want, with AI-recommended P&L columns, P&L bridge columns, cost bars, and an optional safety-checked cost doughnut. Build the Accounting Pack and generate both an accrual-basis profit-and-loss view and an owner dashboard only from one POSTED journal; keep net income separate from cash. Create and visually verify management-dashboard.xlsx when spreadsheet capabilities are available, otherwise produce Markdown and JSON. Treat every report as an internal management output, not as statutory, professionally correct, reviewed, or filing-ready."
