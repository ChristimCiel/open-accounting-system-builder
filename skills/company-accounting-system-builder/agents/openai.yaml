interface:
  display_name: "Open Accounting System Builder"
  short_description: "Build books and owner reports from one POSTED journal"
  brand_color: "#0F766E"
  default_prompt: "Use $company-accounting-system-builder to first show me a recommended multi-select feature menu without treating recommendations as confirmation. If I select O6, expand dashboard, profit, cost, data-trust, close, and custom reporting choices. Build the Accounting Pack and generate both an accrual-basis profit-and-loss view and an owner dashboard only from one POSTED journal; keep net income separate from cash. Create management-dashboard.xlsx when spreadsheet creation and verification are available, otherwise produce Markdown and JSON. Treat every report as an internal management output, not as statutory, professionally correct, reviewed, or filing-ready."
